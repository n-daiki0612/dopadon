    <!-- レイアウトのみ。商品選択・購入・もどるボタンの処理は未接続です。 -->
    <main class="game-window" aria-labelledby="shop-title">
      <header class="title-bar">
        <h1 id="shop-title"><svg class="icon" aria-hidden="true"><use href="#icon-fish" /></svg>アイテム購入</h1>
        <div class="wallet" aria-label="所持金 2480ゴールド"><span class="wallet-label">所持金</span><svg class="icon" aria-hidden="true"><use href="#icon-coin" /></svg><strong><b id = "money">2480</b><span>G</span></strong></div>
      </header>

      <div class="shop-content">
        <section class="catalog" aria-label="海の幸をとる道具一覧">
          <div class="category-tabs" role="group" aria-label="道具の種類">
            <button class="category active" type="button" aria-pressed="true">すべて</button>
            <button class="category" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-hook" /></svg>釣り</button>
            <button class="category" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-shell" /></svg>磯あそび</button>
            <button class="category" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-mask" /></svg>素もぐり</button>
          </div>
          <div class="item-grid">
            <button class="item-slot selected" type="button" aria-pressed="true" aria-label="竹の釣りざお、480ゴールド、選択中"><span class="item-name">竹の釣りざお</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-rod" /></svg><span class="item-price">480 <small>G</small></span><span class="selection-arrow" aria-hidden="true">▶</span></button>
            <button class="item-slot" type="button" aria-pressed="false" aria-label="丸いたも網、360ゴールド"><span class="item-name">丸いたも網</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-net" /></svg><span class="item-price">360 <small>G</small></span></button>
            <button class="item-slot" type="button" aria-pressed="false" aria-label="潮干狩りセット、1200ゴールド"><span class="item-name">潮干狩りセット</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-rake" /></svg><span class="item-price">1,200 <small>G</small></span></button>
            <button class="item-slot" type="button" aria-pressed="false" aria-label="潜水マスク、960ゴールド"><span class="item-name">潜水マスク</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-mask" /></svg><span class="item-price">960 <small>G</small></span></button>
            <button class="item-slot" type="button" aria-pressed="false" aria-label="足ひれ、680ゴールド"><span class="item-name">足ひれ</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-fins" /></svg><span class="item-price">680 <small>G</small></span></button>
            <button class="item-slot" type="button" aria-pressed="false" aria-label="魚かご、820ゴールド"><span class="item-name">魚かご</span><svg class="item-picture" viewBox="0 0 160 160" aria-hidden="true"><use href="#art-basket" /></svg><span class="item-price">820 <small>G</small></span></button>
          </div>
          <div class="catalog-footer"><span>全 6 種類</span><span class="page-number"><span aria-hidden="true">◀</span> 1 / 1 <span aria-hidden="true">▶</span></span></div>
        </section>

        <aside class="item-detail" aria-labelledby="detail-title">
          <h2 id="detail-title">竹の釣りざお</h2>
          <div class="preview-stage"><span class="type-label">釣り道具</span><svg viewBox="0 0 160 160" aria-hidden="true"><use href="#art-rod" /></svg></div>
          <p class="item-description">軽くてしなやかな竹のさお。<br />堤防で小さな魚をねらおう。</p>
          <dl class="item-stats"><div><dt>つかまえやすさ</dt><dd class="stat-bonus">＋8</dd></div><div><dt>とれる海の幸</dt><dd>アジ・サバ</dd></div></dl>
          <div class="stat-preview"><span>装備後のつかまえやすさ</span><strong>12 <span aria-hidden="true">→</span> <span class="stat-bonus">20</span></strong></div>
          <div class="purchase-price"><span>価格</span><strong>480 <small>G</small></strong></div>
          <button class="buy-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-coin" /></svg>購入する</button>
          <p class="owned-count">所持数：0 個</p>
        </aside>
      </div>

      <footer class="bottom-bar">
        <div class="message-box"><span class="merchant-portrait"><svg viewBox="20 12 120 125" aria-hidden="true"><use href="#art-fisher" width="160" height="160" /></svg></span><div><span class="merchant-name">浜の道具屋さん</span><p>今日は何がとれるかね？<br class="mobile-break" /> 道具をそろえて海へ行こう！</p></div><span class="message-arrow" aria-hidden="true">▼</span></div>
        <button class="back-button" type="button"><span aria-hidden="true">◀</span> もどる</button>
      </footer>
    </main>
  </body>
</html>
