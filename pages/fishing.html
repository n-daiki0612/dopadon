<section class="fishing-page">
  <div class="section-heading">
    <span id="equipment" class="tag"></span>
  </div>
  <div class="fishing-hud">
    <div>残り <strong id="hud-time">30</strong> 秒</div>
    <div>捕獲 <strong id="hud-count">0 個 / ゴミ 0 個</strong></div>
  </div>
  <progress
    id="time-progress"
    max="1"
    value="1"
    aria-label="残り時間"
  ></progress>
  <div id="sea" aria-label="漁場"><div id="aim" hidden></div></div>
  <p id="fishing-help" class="instruction"></p>
</section>
