<section>
  <div class="section-heading">
    <div>
      <h1>本日の一杯、できあがり！</h1>
    </div>
    <span class="tag" data-result="size"></span>
  </div>

  <div class="result-grid">
    <div class="dish-card">
      <h2 data-result="name"></h2>

      <div class="result-bowl">
        <img src="assets/ui/bowl.png" alt="捕獲した食材で作った海鮮丼" />
        <div id="toppings"></div>
      </div>

      <p data-result="comment"></p>
      <span class="tag">食材 <strong id="result-count"></strong></span>
    </div>

    <div class="receipt">
      <h2>売上のおしながき</h2>

      <dl class="score-list">
        <div>
          <dt hidden>収穫物</dt>
          <dd><ul id="shukaku"></ul></dd>
        </div>

        <div class="bonus-row">
          <dt><span data-result="bonusName"></span></dt>
          <dd>+<span data-result="bonus"></span></dd>
        </div>

        <div>
          <dt>ペナルティ</dt>
          <dd>-<span data-result="penalty"></span></dd>
        </div>

        <div class="total-row">
          <dt>今回の売上</dt>
          <dd data-result="totalScore"></dd>
        </div>
      </dl>

      <p id="settled-note" class="muted"></p>
    </div>
  </div>

  <details class="catch-details" open>
    <summary>捕獲した海の幸・ゴミの内訳</summary>
    <ul id="catch-list"></ul>
  </details>

  <div class="actions title-actions">
    <button id="retry" class="image-button start-button" type="button">
      <img src="./assets/ui/btn_start.png" alt="もう一度漁に出る（出港）" />
    </button>
    <button id="shop" class="image-button shop-button" type="button">
      <img src="./assets/ui/btn_shop.png" alt="アップグレード（準備）" />
    </button>
    <button id="title" class="text-button">タイトルへ戻る</button>
  </div>
</section>
