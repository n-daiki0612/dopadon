<section class="title-page">
  <div class="hero-copy">
    <h1 class="title-logo">
      <img src="./assets/ui/logo.png" alt="おさかな集めて海鮮丼" />
    </h1>
    <div class="actions title-actions">
      <button id="start" class="image-button start-button" type="button">
        <img src="./assets/ui/btn_start.png" alt="漁に出る（出港）" />
      </button>
      <button id="shop" class="image-button shop-button" type="button">
        <img src="./assets/ui/btn_shop.png" alt="アップグレード（準備）" />
      </button>
    </div>
    <p id="title-stats" class="muted"></p>
    <button id="last-result" class="text-button" hidden>
      直前のリザルトを見る
    </button>
  </div>
  <div class="hero-art" aria-hidden="true">
    <span class="round-label">Let's<br /><b>海鮮丼！</b></span
    >
    <div class="hero-dish">
      <img class="hero-bowl" src="./assets/ui/bowl.png" alt="" /><img
      class="hero-fish one"
      src="./assets/fish/tai.png"
      alt=""
    /><img class="hero-fish two" src="./assets/fish/sakuraebi.png" alt="" /><img
      class="hero-fish three"
      src="./assets/fish/maguro.png"
      alt=""
    />
      <img class="hero-fish shrimp-extra shrimp-left" src="./assets/fish/sakuraebi.png" alt="" />
      <img class="hero-fish shrimp-extra shrimp-front" src="./assets/fish/sakuraebi.png" alt="" />
      <img class="hero-fish shrimp-extra shrimp-right" src="./assets/fish/sakuraebi.png" alt="" />
    </div>
  </div>
  <ol class="steps">
    <li>
      <b>01 / 漁に出る</b
      ><span>魚をクリックしてHPを0に。<br />赤いゴミには気をつけて！</span>
    </li>
    <li>
      <b>02 / 丼をつくる</b
      ><span>時間が来たら自動で盛り付け。<br />組み合わせでボーナス！</span>
    </li>
    <li>
      <b>03 / もっと豊かな漁へ</b
      ><span>売上で道具と能力を強化。<br />次の漁でもっと集めよう。</span>
    </li>
  </ol>
</section>
